name: Daily Scan

on:
  schedule:
    - cron: "0 6 * * *"   # runs daily at 6 AM UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install papermill nbconvert

      - name: Run notebook
        run: papermill Untitled16.ipynb output.ipynb

      - name: Convert notebook to HTML
        run: jupyter nbconvert --to html output.ipynb

      - name: Convert notebook to PDF
        run: jupyter nbconvert --to pdf output.ipynb

      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: notebook-results
          path: |
            output.ipynb
            output.html
            output.pdf
