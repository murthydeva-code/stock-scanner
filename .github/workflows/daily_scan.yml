name: Daily Scan

on:
  schedule:
    - cron: "30 3 * * *"   # runs daily at 9 AM IST
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install papermill nbconvert openpyxl pandas

      - name: Run notebook
        run: papermill Untitled16.ipynb output.ipynb

      - name: Convert notebook to HTML
        run: jupyter nbconvert --to html output.ipynb

      - name: Convert notebook to PDF
        run: jupyter nbconvert --to pdf output.ipynb

      - name: Export results to Excel
        run: |
          python - <<'EOF'
          import nbformat, pandas as pd
          nb = nbformat.read("output.ipynb", as_version=4)

          sheet_names = ["RSI_Scan", "Volume_Profile", "Pivot_Levels", "Gap_Up_Orders"]
          dfs = []
          for cell in nb.cells:
              if cell.cell_type == "code" and "outputs" in cell:
                  for out in cell.outputs:
                      if out.output_type == "execute_result" and "data" in out and "text/plain" in out.data:
                          try:
                              df = eval(out.data["text/plain"])
                              if isinstance(df, pd.DataFrame):
                                  dfs.append(df)
                          except Exception:
                              pass

          with pd.ExcelWriter("output.xlsx") as writer:
              for i, df in enumerate(dfs):
                  sheet_name = sheet_names[i] if i < len(sheet_names) else f"Sheet{i+1}"
                  df.to_excel(writer, sheet_name=sheet_name)
          EOF

      - name: Commit Excel report back to repo
        run: |
          mkdir -p reports
          mv output.xlsx reports/output.xlsx
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add reports/output.xlsx
          git commit -m "Add daily Excel scan report"
          git push
