name: Daily Stock Scan

on:
  schedule:
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Python dependencies (with debug)
        run: |
          echo "=== Upgrading pip ==="
          python -m pip install --upgrade pip
          echo "=== Installing numpy ==="
          pip install numpy
          echo "=== Installing pandas ==="
          pip install pandas
          echo "=== Installing yfinance ==="
          pip install yfinance
          echo "=== Installed packages (verification) ==="
          pip list | grep -i numpy
          pip list | grep -i pandas
          pip list | grep -i yfinance
      
      - name: Run scanner (auto-sends Telegram text alert)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/scanner_full.py
      
      - name: Upload scan results as artifact (kept for 30 days)
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_id }}
          path: output/
          retention-days: 30
