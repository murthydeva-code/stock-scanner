name: Daily Stock Scan

on:
  schedule:
    - cron: "30 3 * * *"   # Runs daily at 9 AM IST
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install nbformat pandas openpyxl jupyter

      - name: Run notebook
        run: |
          jupyter nbconvert --to notebook --execute output.ipynb --output output.ipynb

      - name: Export results to Excel
        run: |
          python - <<'EOF'
          import pandas as pd
          from datetime import datetime

          # Dummy fallback DataFrame so file is always created
          df = pd.DataFrame({"Status":["No data"], "Note":["Notebook produced no DataFrame"]})

          today = datetime.now().strftime("%Y-%m-%d")
          filename = f"output_{today}.xlsx"

          with pd.ExcelWriter(filename) as writer:
              df.to_excel(writer, sheet_name="Sheet1")
          EOF

      - name: Commit Excel report back to repo
        run: |
          mkdir -p reports
          mv output_*.xlsx reports/
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add reports/output_*.xlsx
          git commit -m "Add daily Excel scan report with timestamp" || echo "No changes to commit"
          git push

      - name: Upload results as artifact
        uses: actions/upload-artifact@v3
        with:
          name: notebook-results
          path: |
            output.ipynb
            reports/output_*.xlsx
