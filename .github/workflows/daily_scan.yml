name: Daily Stock Scan

on:
  schedule:
    # 4:30 PM IST = 11:00 UTC (IST = UTC + 5:30)
    # Run Monday-Friday only (Indian market days)
    - cron: '30 11 * * 1-5'
  workflow_dispatch:  # Allow manual trigger from Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright browser (for PDF rendering)
        run: |
          python -m playwright install chromium --with-deps
      
      - name: Run scanner (auto-sends Telegram alert)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/scanner_full.py
      
      - name: Build watchlist HTML
        run: |
          python3 scripts/build_watchlist_html.py
      
      - name: Render PDF + send via Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/render_pdf.py output/scanner_watchlist_full.html output/scanner_watchlist_full.pdf
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          import telegram_alert
          if telegram_alert.BOT_TOKEN and telegram_alert.CHAT_ID:
              telegram_alert.send_document('output/scanner_watchlist_full.pdf', caption='📊 Full watchlist PDF')
          "
      
      - name: Upload scan results as artifact (kept for 30 days)
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_id }}
          path: output/
          retention-days: 30
